events {
    worker_connections 1024;
}

http {
    # Tokens in query strings and Referer headers must not enter access logs.
    # Keep only the normalized path; never use $request or $request_uri here.
    log_format account_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log account_safe;
    # Keys come from the TCP peer, never client-supplied forwarding headers.
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_req_status 429;
    client_max_body_size 1m;
    client_body_timeout 15s;

    upstream web {
        server web:3000;
    }

    upstream platform {
        server platform:8080;
    }

    # HTTP - redirect all traffic to HTTPS
    server {
        listen 80;
        server_name agent-communication.online www.agent-communication.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://agent-communication.online$request_uri;
        }
    }

    # HTTPS - main server
    server {
        listen 443 ssl;
        http2 on;
        server_name agent-communication.online www.agent-communication.online;

        ssl_certificate     /etc/letsencrypt/live/agent-communication.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agent-communication.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS - tell browsers to always use HTTPS for this domain
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Platform API - versioned Registry, MQ, signed policy and gateway endpoints.
        # Explicit public early-access artifacts; directory browsing is disabled.
        location /downloads/ {
            alias /srv/downloads/;
            autoindex off;
            types {
                application/pdf pdf;
                application/zip zip;
                application/json json;
                text/plain txt;
            }
            default_type application/octet-stream;
            limit_except GET { deny all; }
        }

        location = /healthz {
            proxy_pass http://platform;
        }

        location /api/v1/ {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v2/ {
            # A 1 MiB raw envelope expands under base64 in the JSON request.
            client_max_body_size 2m;
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Platform Admin Console
        location /admin {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # One documentation home: role guides and the Platform API reference
        # use the same reader, backed by read-only docs/ mounts.
        location = /docs {
            return 308 /docs/$is_args$args;
        }

        location = /docs/ {
            # Keep the shared trailing-slash URL while Next.js owns the page.
            proxy_pass http://web/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /docs/api {
            return 308 /docs/?path=platform/guides/API.md;
        }

        location = /docs/api/ {
            return 308 /docs/?path=platform/guides/API.md;
        }

        location ^~ /docs/api/ {
            return 404;
        }

        # Preserve previously shared guide links, including their query path.
        location = /guide {
            return 308 /docs/$is_args$args;
        }

        location ~ ^/guide/(.*)$ {
            return 308 /docs/$1$is_args$args;
        }

        # Historical records are deliberately outside the Markdown routes.

        location = /docs/source/deploy/README.md {
            alias /srv/docs/deploy/README.md;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/deploy/users/ {
            alias /srv/docs/deploy/users/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/deploy/agents/ {
            alias /srv/docs/deploy/agents/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/deploy/developers/ {
            alias /srv/docs/deploy/developers/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/deploy/architecture/ {
            alias /srv/docs/deploy/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/deploy/operations/ {
            alias /srv/docs/deploy/operations/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/deploy/maintenance/ {
            alias /srv/docs/deploy/maintenance/;
            include /etc/nginx/docs-source.conf;
        }

        location = /docs/source/deploy/testing/TEST_STRATEGY.md {
            alias /srv/docs/deploy/testing/TEST_STRATEGY.md;
            include /etc/nginx/docs-source.conf;
        }

        location = /docs/source/deploy/testing/TEST_EXECUTION_GUIDE.md {
            alias /srv/docs/deploy/testing/TEST_EXECUTION_GUIDE.md;
            include /etc/nginx/docs-source.conf;
        }

        location = /docs/source/deploy/testing/TWO_AGENT_HITL_RUNBOOK.md {
            alias /srv/docs/deploy/testing/TWO_AGENT_HITL_RUNBOOK.md;
            include /etc/nginx/docs-source.conf;
        }

        location = /docs/source/web/README.md {
            alias /srv/docs/web/README.md;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/web/architecture/ {
            alias /srv/docs/web/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/web/operations/ {
            alias /srv/docs/web/operations/;
            include /etc/nginx/docs-source.conf;
        }

        location = /docs/source/platform/README.md {
            alias /srv/docs/platform/README.md;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/platform/architecture/ {
            alias /srv/docs/platform/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/platform/guides/ {
            alias /srv/docs/platform/guides/;
            include /etc/nginx/docs-source.conf;
        }

        location = /docs/source/sdk/README.md {
            alias /srv/docs/sdk/README.md;
            include /etc/nginx/docs-source.conf;
        }

        # Historical audit reference; keep it in GitHub, outside the portal.
        location = /docs/source/sdk/architecture/CAPABILITY_SKILL_MAP.md {
            return 404;
        }

        location ^~ /docs/source/sdk/architecture/ {
            alias /srv/docs/sdk/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/sdk/guides/ {
            alias /srv/docs/sdk/guides/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /docs/source/ {
            return 404;
        }

        location ^~ /docs/ {
            return 404;
        }

        # Email links contain one-time tokens. GET only renders the confirmation
        # page; the app consumes tokens only after an explicit same-origin POST.
        location ~ ^/(verify-email|reset-password|confirm-password-change)(/|$) {
            proxy_hide_header Cache-Control;
            proxy_hide_header Referrer-Policy;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            # add_header at this level replaces inherited headers in nginx.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Limit account mutations, email requests and credential hashing before Node.
        # Cover suffixes too: NextAuth's catch-all route can receive extra segments.
        location ~ ^/api/auth/(register|resend-verification|verify-email|forgot-password|reset-password|change-password|confirm-password-change|callback/credentials)(/|$) {
            limit_req zone=auth_per_ip burst=5 nodelay;
            client_max_body_size 16k;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web UI - all other requests including /api/auth/*
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
