events {
    worker_connections 1024;
}

http {
    # Keys come from the TCP peer, never client-supplied forwarding headers.
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_req_status 429;
    client_max_body_size 1m;
    client_body_timeout 15s;

    upstream web {
        server web:3000;
    }

    upstream platform {
        server platform:8080;
    }

    # HTTP - redirect all traffic to HTTPS
    server {
        listen 80;
        server_name agent-communication.online www.agent-communication.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://agent-communication.online$request_uri;
        }
    }

    # HTTPS - main server
    server {
        listen 443 ssl;
        http2 on;
        server_name agent-communication.online www.agent-communication.online;

        ssl_certificate     /etc/letsencrypt/live/agent-communication.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/agent-communication.online/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS - tell browsers to always use HTTPS for this domain
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Platform API - /api/v1/* path (platform's own endpoints)
        # Explicit public early-access artifacts; directory browsing is disabled.
        location /downloads/ {
            alias /srv/downloads/;
            autoindex off;
            types {
                application/pdf pdf;
                application/zip zip;
                application/json json;
                text/plain txt;
            }
            default_type application/octet-stream;
            limit_except GET { deny all; }
        }

        location = /healthz {
            proxy_pass http://platform;
        }

        location /api/v1/ {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Platform Admin Console
        location /admin {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Platform API Docs
        location /docs {
            proxy_pass http://platform;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The guide reads current Markdown directly from read-only docs/
        # mounts. Historical records are deliberately outside these routes.
        location = /guide {
            return 301 /guide/;
        }

        location = /guide/ {
            root /srv/site;
            try_files /guide/index.html =404;
            default_type text/html;
            charset utf-8;
            expires -1;
        }

        location = /guide/source/deploy/README.md {
            alias /srv/docs/deploy/README.md;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/deploy/users/ {
            alias /srv/docs/deploy/users/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/deploy/agents/ {
            alias /srv/docs/deploy/agents/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/deploy/developers/ {
            alias /srv/docs/deploy/developers/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/deploy/architecture/ {
            alias /srv/docs/deploy/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/deploy/operations/ {
            alias /srv/docs/deploy/operations/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/deploy/maintenance/ {
            alias /srv/docs/deploy/maintenance/;
            include /etc/nginx/docs-source.conf;
        }

        location = /guide/source/deploy/testing/TEST_STRATEGY.md {
            alias /srv/docs/deploy/testing/TEST_STRATEGY.md;
            include /etc/nginx/docs-source.conf;
        }

        location = /guide/source/deploy/testing/TEST_EXECUTION_GUIDE.md {
            alias /srv/docs/deploy/testing/TEST_EXECUTION_GUIDE.md;
            include /etc/nginx/docs-source.conf;
        }

        location = /guide/source/deploy/testing/TWO_AGENT_HITL_RUNBOOK.md {
            alias /srv/docs/deploy/testing/TWO_AGENT_HITL_RUNBOOK.md;
            include /etc/nginx/docs-source.conf;
        }

        location = /guide/source/web/README.md {
            alias /srv/docs/web/README.md;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/web/architecture/ {
            alias /srv/docs/web/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/web/operations/ {
            alias /srv/docs/web/operations/;
            include /etc/nginx/docs-source.conf;
        }

        location = /guide/source/platform/README.md {
            alias /srv/docs/platform/README.md;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/platform/architecture/ {
            alias /srv/docs/platform/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/platform/guides/ {
            alias /srv/docs/platform/guides/;
            include /etc/nginx/docs-source.conf;
        }

        location = /guide/source/sdk/README.md {
            alias /srv/docs/sdk/README.md;
            include /etc/nginx/docs-source.conf;
        }

        # Historical audit reference; keep it in GitHub, outside the guide.
        location = /guide/source/sdk/architecture/CAPABILITY_SKILL_MAP.md {
            return 404;
        }

        location ^~ /guide/source/sdk/architecture/ {
            alias /srv/docs/sdk/architecture/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/sdk/guides/ {
            alias /srv/docs/sdk/guides/;
            include /etc/nginx/docs-source.conf;
        }

        location ^~ /guide/source/ {
            return 404;
        }

        # Public introduction is static Web content, independent of either app process.
        location = / {
            root /srv/site;
            try_files /index.html =404;
            default_type text/html;
            charset utf-8;
            expires -1;
        }

        # Limit credential hashing and account creation before they reach Node.
        # Cover suffixes too: NextAuth's catch-all route can receive extra segments.
        location ~ ^/api/auth/(register|callback/credentials)(/|$) {
            limit_req zone=auth_per_ip burst=5 nodelay;
            client_max_body_size 16k;
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web UI - all other requests including /api/auth/*
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
