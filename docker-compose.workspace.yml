# Optional local overlay. Production also requires docker-compose.workspace.production.yml.
# This file alone publishes the Gateway only on the host loopback interface.
services:
  workspace-gateway:
    build:
      context: ./workspace-gateway
    environment:
      WORKSPACE_GATEWAY_SECRET: ${WORKSPACE_GATEWAY_SECRET:?Set a separate Workspace Gateway service secret}
      WORKSPACE_GATEWAY_DOMAIN: ${WORKSPACE_GATEWAY_DOMAIN:-localhost:8090}
      WORKSPACE_GATEWAY_SCHEME: ${WORKSPACE_GATEWAY_SCHEME:-http}
      WORKSPACE_GATEWAY_CONTROL_HOST: ${WORKSPACE_GATEWAY_CONTROL_HOST:-localhost:8090}
      WORKSPACE_GATEWAY_SERVICE_HOST: workspace-gateway:8090
      WORKSPACE_GATEWAY_PORTAL_ORIGIN: ${NEXTAUTH_URL:?Set the portal origin}
      WORKSPACE_GATEWAY_TRUSTED_PROXY_CIDRS: ""
      WORKSPACE_GATEWAY_HTTP_LIMIT: ${WORKSPACE_GATEWAY_HTTP_LIMIT:-2097152}
      WORKSPACE_GATEWAY_FRAME_LIMIT: ${WORKSPACE_GATEWAY_FRAME_LIMIT:-262144}
      WORKSPACE_GATEWAY_HTTP_CONCURRENCY: ${WORKSPACE_GATEWAY_HTTP_CONCURRENCY:-16}
      WORKSPACE_GATEWAY_WS_CONCURRENCY: ${WORKSPACE_GATEWAY_WS_CONCURRENCY:-16}
      WORKSPACE_GATEWAY_GLOBAL_HTTP_CONCURRENCY: ${WORKSPACE_GATEWAY_GLOBAL_HTTP_CONCURRENCY:-64}
      WORKSPACE_GATEWAY_GLOBAL_WS_CONCURRENCY: ${WORKSPACE_GATEWAY_GLOBAL_WS_CONCURRENCY:-64}
      WORKSPACE_GATEWAY_GLOBAL_TUNNEL_CONCURRENCY: ${WORKSPACE_GATEWAY_GLOBAL_TUNNEL_CONCURRENCY:-32}
      WORKSPACE_GATEWAY_BUFFER_BYTES: ${WORKSPACE_GATEWAY_BUFFER_BYTES:-134217728}
      WORKSPACE_GATEWAY_QUEUED_BYTES: ${WORKSPACE_GATEWAY_QUEUED_BYTES:-8388608}
      WORKSPACE_GATEWAY_BROWSER_QUEUE_SIZE: ${WORKSPACE_GATEWAY_BROWSER_QUEUE_SIZE:-4}
      WORKSPACE_GATEWAY_WS_MAX_QUEUE: ${WORKSPACE_GATEWAY_WS_MAX_QUEUE:-2}
      WORKSPACE_GATEWAY_UVICORN_CONCURRENCY: ${WORKSPACE_GATEWAY_UVICORN_CONCURRENCY:-256}
      WORKSPACE_GATEWAY_REQUEST_TIMEOUT: ${WORKSPACE_GATEWAY_REQUEST_TIMEOUT:-30}
      WORKSPACE_GATEWAY_WS_SEND_TIMEOUT: ${WORKSPACE_GATEWAY_WS_SEND_TIMEOUT:-10}
      WORKSPACE_GATEWAY_TUNNEL_RATE: ${WORKSPACE_GATEWAY_TUNNEL_RATE:-1200}
      WORKSPACE_GATEWAY_TUNNEL_IDLE_TIMEOUT: ${WORKSPACE_GATEWAY_TUNNEL_IDLE_TIMEOUT:-90}
      WORKSPACE_GATEWAY_MAX_LAUNCHES: ${WORKSPACE_GATEWAY_MAX_LAUNCHES:-1000}
      WORKSPACE_GATEWAY_MAX_SESSIONS: ${WORKSPACE_GATEWAY_MAX_SESSIONS:-10000}
      WORKSPACE_GATEWAY_MAX_NODE_SESSIONS: ${WORKSPACE_GATEWAY_MAX_NODE_SESSIONS:-100}
      WORKSPACE_GATEWAY_MAX_NODES: ${WORKSPACE_GATEWAY_MAX_NODES:-1000}
      WORKSPACE_GATEWAY_MAX_ACCOUNT_NODES: ${WORKSPACE_GATEWAY_MAX_ACCOUNT_NODES:-10}
      WORKSPACE_GATEWAY_MAX_PENDING: ${WORKSPACE_GATEWAY_MAX_PENDING:-100}
      WORKSPACE_GATEWAY_MAX_ACCOUNT_PENDING: ${WORKSPACE_GATEWAY_MAX_ACCOUNT_PENDING:-3}
      WORKSPACE_GATEWAY_MAX_ENROLLMENTS: ${WORKSPACE_GATEWAY_MAX_ENROLLMENTS:-200}
      WORKSPACE_GATEWAY_MAX_ACCOUNT_ENROLLMENTS: ${WORKSPACE_GATEWAY_MAX_ACCOUNT_ENROLLMENTS:-3}
      WORKSPACE_GATEWAY_SOURCE_RATE: ${WORKSPACE_GATEWAY_SOURCE_RATE:-10}
      WORKSPACE_GATEWAY_ACCOUNT_RATE: ${WORKSPACE_GATEWAY_ACCOUNT_RATE:-20}
      WORKSPACE_GATEWAY_ACCOUNT_READ_RATE: ${WORKSPACE_GATEWAY_ACCOUNT_READ_RATE:-120}
      WORKSPACE_GATEWAY_DEVICE_RATE: ${WORKSPACE_GATEWAY_DEVICE_RATE:-60}
      WORKSPACE_GATEWAY_DEVICE_STATE_RATE: ${WORKSPACE_GATEWAY_DEVICE_STATE_RATE:-120}
      WORKSPACE_GATEWAY_RATE_WINDOW: ${WORKSPACE_GATEWAY_RATE_WINDOW:-60}
      WORKSPACE_GATEWAY_RATE_ENTRIES: ${WORKSPACE_GATEWAY_RATE_ENTRIES:-2048}
      WORKSPACE_GATEWAY_SOURCE_ENTRIES: ${WORKSPACE_GATEWAY_SOURCE_ENTRIES:-1024}
      WORKSPACE_GATEWAY_DATABASE_LIMIT_BYTES: ${WORKSPACE_GATEWAY_DATABASE_LIMIT_BYTES:-134217728}
      WORKSPACE_GATEWAY_MAINTENANCE_INTERVAL: ${WORKSPACE_GATEWAY_MAINTENANCE_INTERVAL:-60}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - workspace_gateway_data:/data
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - agent-net
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 384m
    cpus: "0.5"
  web:
    environment:
      WORKSPACE_GATEWAY_URL: http://workspace-gateway:8090
      WORKSPACE_GATEWAY_SECRET: ${WORKSPACE_GATEWAY_SECRET:?Set a separate Workspace Gateway service secret}
      WORKSPACE_GATEWAY_DOMAIN: ${WORKSPACE_GATEWAY_DOMAIN:-localhost:8090}
      WORKSPACE_GATEWAY_PUBLIC_URL: ${WORKSPACE_GATEWAY_PUBLIC_URL:-http://localhost:8090}
    depends_on:
      - workspace-gateway
volumes:
  workspace_gateway_data:
