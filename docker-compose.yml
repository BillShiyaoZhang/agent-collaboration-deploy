services:
  nginx:
    image: nginx:alpine
    container_name: agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - platform
    networks:
      - agent-net
    restart: unless-stopped

  platform:
    build:
      context: ./agent-comm-platform
      dockerfile: Dockerfile
    container_name: agent-platform
    environment:
      - PLATFORM_ADMIN_TOKEN=${PLATFORM_ADMIN_TOKEN}
    volumes:
      - platform_data:/data
      - ./config.yaml:/etc/platform/config.yaml:ro
    ports:
      - "45041:45041"
      - "45041:45041/udp"
    networks:
      - agent-net
    restart: unless-stopped

  web:
    build:
      context: ./agent-collaboration-web
      dockerfile: Dockerfile
    container_name: agent-web
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://8.130.40.38}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AGENT_PLATFORM_URL=http://platform:8080
    volumes:
      - web_data:/app/data
    networks:
      - agent-net
    restart: unless-stopped

networks:
  agent-net:
    driver: bridge

volumes:
  platform_data:
  web_data: