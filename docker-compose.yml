services:
  nginx:
    # Pin the verified official release; regional mirrors may cache older tags.
    image: nginx:alpine@sha256:c8497b180665e631ec92a5091125bec5b214f0e2b99409e30653a125b37557da
    container_name: agent-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/docs-source.conf:/etc/nginx/docs-source.conf:ro
      - ./agent-collaboration-web/site:/srv/site:ro
      # Serve reviewed paths directly from the four repositories' docs/ trees.
      - ./docs:/srv/docs/deploy:ro
      - ./agent-collaboration-web/docs:/srv/docs/web:ro
      - ./agent-comm-platform/docs:/srv/docs/platform:ro
      - ./agent-comm-platform/agent-comm/docs:/srv/docs/sdk:ro
      - ./downloads:/srv/downloads:ro
      - ./acme-challenge:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - platform
    networks:
      - agent-net
    restart: unless-stopped

  platform:
    build:
      context: ./agent-comm-platform
      dockerfile: Dockerfile
    container_name: agent-platform
    environment:
      - PLATFORM_ADMIN_TOKEN=${PLATFORM_ADMIN_TOKEN:?Set PLATFORM_ADMIN_TOKEN in .env}
    volumes:
      - platform_data:/data
      - ./deploy/platform/config.yaml:/etc/platform/config.yaml:ro
    ports:
      - "45041:45041"
      - "45041:45041/udp"
    networks:
      - agent-net
    restart: unless-stopped

  web:
    build:
      context: ./agent-collaboration-web
      dockerfile: Dockerfile
    container_name: agent-web
    environment:
      # One Prisma connection buffers concurrent Web queries before SQLite's single writer.
      - DATABASE_URL=file:/app/data/prod.db?connection_limit=1
      - NEXTAUTH_URL=${NEXTAUTH_URL:?Set NEXTAUTH_URL to the public HTTPS origin}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      - AGENT_PLATFORM_URL=http://platform:8080
    volumes:
      - web_data:/app/data
    networks:
      - agent-net
    restart: unless-stopped

networks:
  agent-net:
    driver: bridge

volumes:
  platform_data:
  web_data:
